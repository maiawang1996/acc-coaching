<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#164f95" />
  <title>ACC 冲刺 · Coaching 学习记录</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root { --ink:#e9eff8; --muted:#8d9caf; --blue:#67a8ff; --blue-deep:#2d6fca; --line:#243141; --panel:#161f2b; --panel2:#1a2634; --bg:#0d141d; --success:#7edbb6; --danger:#ffafae; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.01em} button,input{font:inherit} button{cursor:pointer}
    .shell{max-width:1120px;margin:auto;padding:42px 28px 64px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#8ebfff;text-transform:uppercase;font-weight:700}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 32px}.top h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-.06em}.date{color:var(--muted);font-size:14px;padding-bottom:4px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:28px}.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:14px 6px 13px;margin-right:22px;font-weight:650}.tab.active{color:var(--ink);border-color:var(--blue)}.view{display:none}.view.active{display:block}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:24px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px}.overview{padding:26px}.progress-label{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.progress-label h2{font-size:18px;margin:0}.progress-label strong{font-size:28px;letter-spacing:-.05em}.track{height:9px;border-radius:999px;background:#263544;overflow:hidden;margin:20px 0 13px}.fill{height:100%;width:0;background:linear-gradient(90deg,#4f8eed,#8fc6ff);border-radius:inherit;transition:width .45s ease}.sub{margin:0;color:var(--muted);font-size:14px}.side-stat{padding:26px;display:flex;flex-direction:column;justify-content:space-between;min-height:156px}.side-stat .tiny{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.side-stat b{font-size:34px;letter-spacing:-.06em}.side-stat span{font-size:14px;color:var(--success)}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.section-head h3{margin:0;font-size:16px}.section-head small{color:var(--muted)}.course-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.course{width:100%;text-align:left;display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;color:var(--ink);transition:.2s}.course:hover{border-color:#49637e;transform:translateY(-1px)}.course.done{background:#172a2d;border-color:#2f6d63}.check{width:20px;height:20px;border-radius:50%;border:1.5px solid #607388;display:grid;place-items:center;color:transparent;flex:none;font-size:13px}.course.done .check{background:var(--success);border-color:var(--success);color:#0f2525}.course .num{font-size:12px;color:var(--muted);min-width:24px}.course .title{font-size:14px;line-height:1.35}.course.done .title{color:#d7f4e8}.course.done .num{color:#82cdb4}
    .hours-layout{display:grid;grid-template-columns:1fr 1.05fr;gap:20px}.hours-card{padding:28px}.hours-card h2{margin:8px 0;font-size:25px;letter-spacing:-.04em}.hours-number{font-weight:750;letter-spacing:-.08em;line-height:1}.hours-number #hour-total{display:inline-flex;align-items:baseline;gap:8px;color:var(--ink)}.hour-number-value{font-size:72px}.hour-unit{font-size:14px;letter-spacing:0;color:var(--muted);font-weight:500}.goal{color:var(--muted);font-size:14px}.form-card{padding:24px}.form-card h3{margin:0 0 20px;font-size:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input,textarea{width:100%;background:#101925;border:1px solid #314253;border-radius:8px;color:var(--ink);padding:11px 12px;outline:none}textarea{min-height:132px;resize:vertical;line-height:1.55}input:focus,textarea:focus{border-color:#659ce4}.date-control{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:44px;width:100%;background:#101925;border:1px solid #314253;border-radius:8px;color:var(--ink);padding:11px 12px;font-variant-numeric:tabular-nums}.date-control::after{content:'⌄';color:#a8c8e8;font-size:18px;line-height:1}.date-control input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0}.duration-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duration-option{background:#101925;border:1px solid #314253;border-radius:8px;color:#b8c8da;padding:10px 8px;font-size:13px;font-weight:650}.duration-option.selected{background:#e4eefb;border-color:#e4eefb;color:#101b27}.submit{width:100%;margin-top:18px;background:#e4eefb;color:#101b27;border:0;border-radius:8px;padding:12px;font-weight:750}.submit:hover{background:#fff}.cancel-edit{width:100%;margin-top:10px;background:transparent;color:#a8c8e8;border:1px solid #3b5771;border-radius:8px;padding:10px;font-weight:650}.records{margin-top:26px;overflow:hidden}.records-header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.records-header h3{margin:0;font-size:16px}.record,.record-labels{display:grid;grid-template-columns:78px .75fr 1.7fr 80px;gap:16px;padding:15px 20px;border-bottom:1px solid #223040;align-items:center;font-size:14px}.record-labels{padding-top:10px;padding-bottom:10px;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}.record:last-child{border:0}.record .theme{color:var(--muted);line-height:1.45}.record .duration{font-weight:700;text-align:right;color:#a8d0ff;white-space:nowrap}.edit-session{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:5px;padding:0;border:0;background:transparent;color:#8ebfff;font-size:16px;line-height:1;vertical-align:-2px}.reflection-list{margin-top:18px}.reflection{padding:20px;border-bottom:1px solid #223040}.reflection:last-child{border:0}.reflection-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.reflection-date{color:#8ebfff;font-size:13px;font-weight:700}.edit-reflection{border:1px solid #416786;background:transparent;color:#b8dcff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700}.reflection-content{white-space:pre-wrap;line-height:1.7;color:#dce8f7}.today-note{color:#8ebfff;font-size:14px;font-weight:700}.toast{position:fixed;z-index:5;right:24px;bottom:24px;max-width:370px;border:1px solid #3d7169;background:#15302f;color:#e7fff8;padding:15px 18px;border-radius:11px;box-shadow:0 16px 48px #0007;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(calc(100% + 48px));transition:transform .35s ease,opacity .2s ease,visibility .2s}.toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}.toast b{display:block;margin-bottom:2px}.empty{padding:28px;color:#8d9caf;text-align:center}
    @media(max-width:720px){.shell{padding:28px 16px 48px}.top{align-items:start;flex-direction:column;margin-bottom:18px}.hero,.hours-layout{grid-template-columns:1fr}.course-list{grid-template-columns:1fr}.record,.record-labels{grid-template-columns:68px 1fr 54px;gap:8px}.record .theme{display:block;grid-column:1/-1;grid-row:2;font-size:13px;padding-top:3px}.record .duration{text-align:right}.record-labels span:nth-child(3){grid-column:1/-1;grid-row:2;padding-top:3px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.tabs{overflow:auto}.tab{white-space:nowrap}.date{padding:0}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Professional coaching · personal dashboard</div>
    <div class="top"><h1>ACC 冲刺</h1><div class="date" id="today"></div></div>
    <nav class="tabs" aria-label="记录模块"><button class="tab" data-view="learning">Coaching 学习记录</button><button class="tab active" data-view="hours">ACC 小时数记录</button><button class="tab" data-view="reflection">学习和反思记录</button></nav>
    <section class="view" id="learning">
      <div class="hero"><div class="card overview"><div class="progress-label"><h2>课程进度</h2><strong id="course-count">6 / 24</strong></div><div class="track"><div class="fill" id="course-fill"></div></div><p class="sub" id="course-text">已完成 25% · 距离完成全部课程还差 18 节</p></div><div class="card side-stat"><div class="tiny">本阶段目标</div><b>24 节课程</b><span id="course-side">已完成 6 节，保持节奏</span></div></div>
      <div class="section-head"><h3>课程清单</h3><small>点击课程即可切换完成状态</small></div><div class="course-list" id="course-list"></div>
    </section>
    <section class="view active" id="hours">
      <div class="hours-layout"><div class="card hours-card"><div class="eyebrow">ACC coaching hours</div><h2>你的总小时数</h2><div class="hours-number"><span id="hour-total"><span class="hour-number-value">3</span><span class="hour-unit">小时 0 分钟</span></span></div><p class="goal">目标 100 小时 · 还差 <span id="hour-left">97小时0分钟</span></p><div class="track"><div class="fill" id="hour-fill"></div></div><p class="sub" id="hour-percent">已完成目标的 3%</p></div>
      <form class="card form-card" id="hour-form"><h3 id="hour-form-title">新增 coaching 记录</h3><div class="form-grid"><div><label for="date">日期</label><div class="date-control"><span id="date-display"></span><input id="date" type="date" required /></div></div><div><label for="client">客户 / 学员</label><input id="client" required /></div><div class="wide"><label for="topic">会议主题 / 目标</label><input id="topic" required /></div><div class="wide"><label>时长</label><input id="duration" type="hidden" value="0.5" /><div class="duration-options" role="group" aria-label="选择时长"><button class="duration-option selected" type="button" data-duration="0.5" aria-pressed="true">30 分钟</button><button class="duration-option" type="button" data-duration="0.75" aria-pressed="false">45 分钟</button><button class="duration-option" type="button" data-duration="1" aria-pressed="false">1 小时</button><button class="duration-option" type="button" data-duration="1.25" aria-pressed="false">1 小时 15 分钟</button></div></div></div><button class="submit" id="hour-submit" type="submit">添加本次记录</button><button class="cancel-edit" id="cancel-session-edit" type="button" hidden>取消修改</button></form></div>
      <div class="card records"><div class="records-header"><h3>已记录的 coaching 会谈</h3><span class="sub" id="record-count"></span></div><div id="records"></div></div>
    </section>
    <section class="view" id="reflection">
      <div class="card form-card"><h3>学习和反思记录</h3><p class="today-note" id="reflection-date-note">日期：<span id="reflection-today"></span></p><form id="reflection-form"><label for="reflection-content">今天想记录什么？</label><textarea id="reflection-content" placeholder="写下今天的学习收获、会谈观察或下一步行动…" required></textarea><button class="submit" id="reflection-submit" type="submit">保存今天的记录</button><button class="cancel-edit" id="cancel-reflection-edit" type="button" hidden>取消编辑</button></form></div>
      <div class="card records reflection-list"><div class="records-header"><h3>我的学习和反思</h3><span class="sub" id="reflection-count"></span></div><div id="reflections"></div></div>
    </section>
  </main><div class="toast" id="toast" role="status"></div>
  <script>
    const courses = [
      '欢迎与介绍','什么是教练？','什么是焦点解决','如何构建一个教练会谈？','未来完美场景教练问题','成功的过去和进步的标志','How do I coach?','How do I coach 2?','What is the ICF Code of Ethics?','ICF Code of Ethics Core Competency 3','Mandated Clients','Subsequent Sessions','Core Competencies 1–4','Core Competencies 5–6','Core Competency 7','Core Competency 8','Coaching Practice','Coaching Practice','Coaching Decisions and Coaching Practice','Coaching Habits and Coaching Practice','Coaching Practice','Coaching Practice','Coaching Practice','Next Steps'
    ];
    const seedHours = [
      ['08/15','andy','工作不满意，是否要换工作',.5],['08/19','hetty','工作新任务，压力大想调整',.5],['08/29','hetty','工作卡点，老板不认可',.5],['09/04','andy','想要有更多选择的可能性',.5],['09/05','fanzi','工作卡点，找到状态',.5],['09/09','mayo','工作很忙但状态不佳，想调整状态',.5]
    ];
    const saved = JSON.parse(localStorage.getItem('acc-sprint-data') || '{}');
    let completed = Array.isArray(saved.completed) ? saved.completed : [0,1,2,3,4,5];
    let hours = Array.isArray(saved.hours) ? saved.hours : seedHours;
    let reflections = Array.isArray(saved.reflections) ? saved.reflections : [];
    let editingReflectionIndex = null, editingSessionIndex = null;
    let cloudLoaded = false;
    const rowKey=row=>`${row[0]}|${row[1]}|${row[2]}|${row[3]}`;
    const reflectionKey=item=>`${item.date}|${item.content}`;
    const persist=()=>{localStorage.setItem('acc-sprint-data',JSON.stringify({completed,hours,reflections}));if(cloudLoaded)fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'state',completed,reflections})}).catch(()=>{})};
    const postSession=(type,payload)=>fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,...payload})}).then(async response=>{if(!response.ok)throw new Error(await response.text());return response.json()}),syncSession=(row,sessionDate)=>postSession('session',{session_date:sessionDate,client:row[1],topic:row[2],duration:row[3]}),updateSession=(row,sessionDate)=>postSession('session-update',{id:row[4],session_date:sessionDate,client:row[1],topic:row[2],duration:row[3]});
    async function loadCloud(){try{const response=await fetch('/api/state');if(!response.ok)throw new Error('Cloud unavailable');const cloud=await response.json();const cloudHours=(cloud.hours||[]).map(row=>[row.session_date.slice(5).replace('-','/'),row.client,row.topic,Number(row.duration),row.id,row.session_date]),cloudKeys=new Set(cloudHours.map(rowKey)),localOnly=hours.filter(row=>!cloudKeys.has(rowKey(row)));hours=[...cloudHours,...localOnly];completed=[...new Set([...(cloud.completed||[]),...completed])].sort((a,b)=>a-b);const cloudReflections=Array.isArray(cloud.reflections)?cloud.reflections:[],reflectionKeys=new Set(cloudReflections.map(reflectionKey));reflections=[...cloudReflections,...reflections.filter(item=>!reflectionKeys.has(reflectionKey(item)))];cloudLoaded=true;persist();localOnly.forEach(row=>syncSession(row,row[5]||`${new Date().getFullYear()}-${row[0].replace('/','-')}`).then(savedRow=>{row[4]=savedRow.id;row[5]=savedRow.session_date;persist()}).catch(()=>{}));renderCourses();renderHours();renderReflections()}catch(error){cloudLoaded=false}}
    const toast=(title,detail)=>{const el=document.getElementById('toast');el.innerHTML='<b>'+title+'</b>'+detail;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),4300)};
    function renderCourses(){const list=document.getElementById('course-list');list.innerHTML=courses.map((title,i)=>`<button class="course ${completed.includes(i)?'done':''}" data-id="${i}" aria-pressed="${completed.includes(i)}"><span class="check">✓</span><span class="num">${String(i+1).padStart(2,'0')}</span><span class="title">${i<6?'第'+(i+1)+'节课：': 'Session '+(i+1)+': '}${title}</span></button>`).join('');const n=completed.length,p=Math.round(n/24*100);document.getElementById('course-count').textContent=`${n} / 24`;document.getElementById('course-fill').style.width=p+'%';document.getElementById('course-text').textContent=`已完成 ${p}% · 距离完成全部课程还差 ${24-n} 节`;document.getElementById('course-side').textContent=`已完成 ${n} 节，${n===24?'全部达成！':'保持节奏'}`;}
    const durationParts=value=>{const minutes=Math.round(Number(value)*60);return {hours:Math.floor(minutes/60),minutes:minutes%60}},formatDuration=value=>{const parts=durationParts(value);return parts.hours===0?`${parts.minutes}分钟`:parts.minutes===0?`${parts.hours}小时`:`${parts.hours}小时${parts.minutes}分钟`},formatTotalDuration=value=>{const parts=durationParts(value);return `<span class="hour-number-value">${parts.hours}</span><span class="hour-unit">小时 ${parts.minutes} 分钟</span>`};
    const sortHours=(a,b)=>(b[5]||`2000-${b[0].replace('/','-')}`).localeCompare(a[5]||`2000-${a[0].replace('/','-')}`);
    function renderHours(){const total=hours.reduce((a,r)=>a+Number(r[3]),0),p=Math.min(total,100);document.getElementById('hour-total').innerHTML=formatTotalDuration(total);document.getElementById('hour-left').textContent=formatDuration(Math.max(0,100-total));document.getElementById('hour-fill').style.width=p+'%';document.getElementById('hour-percent').textContent=`已完成目标的 ${p.toFixed(p%1?1:0)}%`;document.getElementById('record-count').textContent=`共 ${hours.length} 次会谈`;document.getElementById('records').innerHTML='<div class="record-labels"><span>日期</span><span>客户</span><span>会议主题 / 目标</span><span>时长</span></div>'+hours.map((row,index)=>({row,index})).sort((a,b)=>sortHours(a.row,b.row)).map(({row,index})=>`<div class="record"><div>${row[0]}</div><div>${row[1]}</div><div class="theme">${row[2]}</div><div class="duration">${formatDuration(row[3])}<button class="edit-session" type="button" data-index="${index}" aria-label="编辑本次会谈" title="编辑">✎</button></div></div>`).join('')||'<div class="empty">还没有记录</div>'}
    const escapeHtml=value=>value.replace(/[&<>'\"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function renderReflections(){document.getElementById('reflection-count').textContent=`共 ${reflections.length} 条`;document.getElementById('reflections').innerHTML=reflections.length?reflections.map((item,index)=>({item,index})).reverse().map(({item,index})=>`<article class="reflection"><div class="reflection-head"><div class="reflection-date">${item.date}</div><button class="edit-reflection" type="button" data-index="${index}">编辑</button></div><div class="reflection-content">${escapeHtml(item.content)}</div></article>`).join(''):'<div class="empty">写下第一条学习或反思记录吧。</div>'}
    document.getElementById('course-list').addEventListener('click',e=>{const b=e.target.closest('.course');if(!b)return;const id=Number(b.dataset.id),before=completed.length;if(completed.includes(id)){completed=completed.filter(x=>x!==id);persist();renderCourses();toast('课程状态已改为未完成',`当前课程进度为 ${completed.length}/24。`)}else{completed=[...completed,id].sort((a,b)=>a-b);persist();renderCourses();toast('恭喜你又完成了一节课！',`课程进度从 ${before}/24 提升到 ${completed.length}/24。`)}});
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.view).classList.add('active')}));
    const setDuration=value=>{document.getElementById('duration').value=value;document.querySelectorAll('.duration-option').forEach(button=>{const selected=button.dataset.duration===value;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))})};
    document.querySelector('.duration-options').addEventListener('click',e=>{const button=e.target.closest('.duration-option');if(button)setDuration(button.dataset.duration)});
    const resetSessionEditor=()=>{editingSessionIndex=null;document.getElementById('hour-form').reset();setCoachingDate(today.toISOString().slice(0,10));setDuration('0.5');document.getElementById('hour-form-title').textContent='新增 coaching 记录';document.getElementById('hour-submit').textContent='添加本次记录';document.getElementById('cancel-session-edit').hidden=true};
    document.getElementById('records').addEventListener('click',e=>{const button=e.target.closest('.edit-session');if(!button)return;editingSessionIndex=Number(button.dataset.index);const row=hours[editingSessionIndex];setCoachingDate(row[5]||`${today.getFullYear()}-${row[0].replace('/','-')}`);document.getElementById('client').value=row[1];document.getElementById('topic').value=row[2];setDuration(String(row[3]));document.getElementById('hour-form-title').textContent='编辑 coaching 记录';document.getElementById('hour-submit').textContent='保存修改';document.getElementById('cancel-session-edit').hidden=false;document.getElementById('client').focus()});
    document.getElementById('cancel-session-edit').addEventListener('click',resetSessionEditor);
    document.getElementById('hour-form').addEventListener('submit',e=>{e.preventDefault();const d=document.getElementById('date').value;const date=d?d.slice(5).replace('-','/'):'今天';const values=[date,document.getElementById('client').value.trim(),document.getElementById('topic').value.trim(),Number(document.getElementById('duration').value)];if(editingSessionIndex!==null){const row=hours[editingSessionIndex];row[0]=values[0];row[1]=values[1];row[2]=values[2];row[3]=values[3];row[5]=d;persist();renderHours();const save=row[4]?updateSession(row,d):syncSession(row,d);save.then(savedRow=>{row[4]=savedRow.id;row[5]=savedRow.session_date;persist()}).catch(()=>toast('修改暂存于当前设备','联网后会自动同步。'));resetSessionEditor();toast('会谈记录已更新',`已更新为 ${formatDuration(row[3])}。`);return}const row=[...values,null,d],before=hours.reduce((a,r)=>a+Number(r[3]),0);hours.push(row);persist();syncSession(row,d).then(savedRow=>{row[4]=savedRow.id;row[5]=savedRow.session_date;persist()}).catch(()=>toast('记录暂存于当前设备','联网后会自动同步。'));renderHours();resetSessionEditor();toast('恭喜你又增长了 coaching 小时数！',`总小时数从 ${formatDuration(before)} 增长到 ${formatDuration(before+row[3])}。`)});
    const resetReflectionEditor=()=>{editingReflectionIndex=null;document.getElementById('reflection-form').reset();document.getElementById('reflection-submit').textContent='保存今天的记录';document.getElementById('cancel-reflection-edit').hidden=true;document.getElementById('reflection-date-note').innerHTML='日期：<span id="reflection-today"></span>';document.getElementById('reflection-today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date())};
    document.getElementById('reflections').addEventListener('click',e=>{const button=e.target.closest('.edit-reflection');if(!button)return;editingReflectionIndex=Number(button.dataset.index);const item=reflections[editingReflectionIndex];document.getElementById('reflection-content').value=item.content;document.getElementById('reflection-submit').textContent='保存修改';document.getElementById('cancel-reflection-edit').hidden=false;document.getElementById('reflection-date-note').textContent=`正在编辑：${item.date}`;document.getElementById('reflection-content').focus();window.scrollTo({top:0,behavior:'smooth'})});
    document.getElementById('cancel-reflection-edit').addEventListener('click',resetReflectionEditor);
    document.getElementById('reflection-form').addEventListener('submit',e=>{e.preventDefault();const content=document.getElementById('reflection-content').value.trim();if(!content)return;if(editingReflectionIndex!==null){const date=reflections[editingReflectionIndex].date;reflections[editingReflectionIndex].content=content;persist();renderReflections();resetReflectionEditor();toast('学习和反思已更新',`已更新 ${date} 的记录。`);return}const date=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());reflections.push({date,content});persist();renderReflections();e.target.reset();toast('今天的学习和反思已保存',`已记录日期：${date}。`)});
    const today=new Date(),formatCoachingDate=value=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(`${value}T00:00:00`)),setCoachingDate=value=>{document.getElementById('date').value=value;document.getElementById('date-display').textContent=formatCoachingDate(value)};document.getElementById('today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(today);document.getElementById('reflection-today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(today);setCoachingDate(today.toISOString().slice(0,10));document.getElementById('date').addEventListener('change',e=>document.getElementById('date-display').textContent=formatCoachingDate(e.target.value));renderCourses();renderHours();renderReflections();loadCloud();
  </script>
